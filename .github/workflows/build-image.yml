name: ai-dvokat image
on:
  push:
    branches: [ai-dvokat]
    tags: ['*-ai*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: custom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  custom-tests:
    if: github.repository == '78dima/open-webui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --force
      - run: npm ci --prefix tests/custom
      - run: npx playwright install --with-deps chromium
        working-directory: tests/custom
      - run: python3 -m unittest discover -s tests/custom -p 'test_*.py'
      - run: npm test --prefix tests/custom
  publish:
    if: github.repository == '78dima/open-webui'
    needs: custom-tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Free runner space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Explicit image tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=0.12.5-ai1-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/78dima/open-webui-legal:${{ steps.version.outputs.tag }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=ai-dvokat
          labels: |
            org.opencontainers.image.source=https://github.com/78dima/open-webui
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
